name: Nexo PostgreSQL tests
on:
  push:
    branches: [nexo-render]
    paths: ['nexo-python/**', '.github/workflows/nexo-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: nexo_ci
          POSTGRES_USER: nexo_ci
          POSTGRES_PASSWORD: disposable-ci-password
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U nexo_ci -d nexo_ci'
          --health-interval 5s --health-timeout 5s --health-retries 12
    defaults:
      run:
        working-directory: nexo-python
    env:
      DATABASE_URL: postgresql://nexo_ci:disposable-ci-password@localhost:5432/nexo_ci
      SECRET_KEY: ci-only-not-for-deployment-734209117-nexo-inventory-testing
      DEBUG: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python manage.py test core.tests --verbosity 2
      - run: python manage.py check
