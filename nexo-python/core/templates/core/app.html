{% load static %}<!doctype html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6c45d5"><title>Nexo · Tu negocio, más simple</title><link rel="icon" href="{% static 'core/favicon.svg' %}"><link rel="stylesheet" href="{% static 'core/style.css' %}"><link rel="stylesheet" href="{% static 'core/experience.css' %}"><script src="{% static 'core/app.js' %}" defer></script><script src="{% static 'core/experience.js' %}" defer></script></head>
<body class="nexo-simple" data-demo="{{ demo|yesno:'true,false' }}" data-password-required="{{ password_required|yesno:'true,false' }}">
<a class="skip-link" href="#page">Ir al contenido</a>
<header class="simple-header"><a class="simple-logo" href="{% if demo %}/demo/app/{% else %}/{% endif %}" aria-label="Nexo, inicio"><span class="brand-mark" aria-hidden="true"><i></i><i></i></span>nexo</a><nav id="navigation" class="desktop-navigation" aria-label="Navegación principal"></nav><div class="header-actions"><button class="help-button" data-action="help"><span aria-hidden="true">?</span> Ayuda</button><button class="account-button" data-action="account" aria-label="Mi cuenta"><span class="avatar">N</span><span id="profile-name">Mi cuenta</span></button></div></header>
<div class="main-layout"><div class="business-strip"><div class="business-picker"><span class="store-icon" aria-hidden="true">▣</span><label for="business-select" class="sr-only">Negocio activo</label><select id="business-select"></select><span class="role-badge" id="role-label"></span></div><button class="text-button" data-action="refresh">↻ Actualizar</button></div>
{% if demo %}<section class="demo-bar" aria-label="Controles de demostración"><div><span class="demo-dot"></span><strong>Estás probando Nexo</strong><small>Datos de ejemplo · Tus cambios son solo para ti</small></div><div class="demo-controls"><label>Probar como <select id="demo-role" aria-label="Probar nivel de acceso"><option value="admin">Administrador</option><option value="employee">Empleado</option></select></label><button type="button" class="text-button" data-action="demo-reset">Reiniciar prueba</button></div></section>{% endif %}
<main class="workspace"><div id="global-error" class="error-banner" hidden role="alert"></div><div id="page" tabindex="-1"><div class="loading-surface"><span class="loader"></span><h2>Preparando tu espacio…</h2></div></div><footer class="app-footer"><span>nexo · Tu negocio, más simple</span><span id="footer-business"></span></footer></main></div>
<nav id="mobile-navigation" class="mobile-navigation" aria-label="Navegación móvil"></nav>
<dialog id="modal" aria-labelledby="modal-title"><div class="modal-head"><div><h2 id="modal-title"></h2><p id="modal-subtitle"></p></div><button class="icon-button" data-action="close-modal" aria-label="Cerrar">×</button></div><div class="form-error" id="modal-error" hidden role="alert"></div><div id="modal-body"></div></dialog><div id="toast" role="status" class="toast" hidden></div>
<form hidden id="csrf-source">{% csrf_token %}</form><form hidden id="logout-form" action="{% if demo %}/demo/logout/{% else %}/logout/{% endif %}" method="post">{% csrf_token %}</form>
</body></html>
